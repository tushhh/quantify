name: Intraday Gain Scanner

on:
  # 13:00–21:00 UTC covers 9:30 AM–4:00 PM ET in both EDT (UTC-4) and EST (UTC-5).
  # The script gates on exact market hours internally, so runs outside 9:30–16:00 ET exit immediately.
  schedule:
    - cron: '*/7 13-21 * * 1-5'
  workflow_dispatch:

jobs:
  gain_scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install '.[dev]'

      - name: Run intraday gain scan
        env:
          HEROKU_APP_URL: ${{ secrets.HEROKU_APP_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          GAIN_ALERT_THRESHOLD_PCT: "1.0"
        run: |
          python scripts/run_gain_scan.py
