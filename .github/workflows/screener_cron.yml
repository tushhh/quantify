name: Screener Cache Cron

# Publishes the trend-screen picks (scripts/run_screener.py) to screener-cache, which the live
# /predict API reads, and appends each new monthly list to the append-only pick-history branch
# so the picks have a real track record (scripts/track_record.py).
on:
  schedule:
    - cron: '*/20 * * * *' # Run every 20 minutes (GitHub often runs it hours apart)
  workflow_dispatch:

jobs:
  cache_screener:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install '.[dev]'

      - name: Run the trend screen and save to JSON
        env:
          PREDICTION_DATA_CACHE_DIR: "./data/cache"
          OUTPUT_JSON_PATH: "screener_results.json"
        run: |
          python scripts/run_screener.py

      - name: Record a new monthly list on pick-history
        run: |
          # Append-only: a normal push, never a force push, so every list stays on record.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin pick-history 2>/dev/null; then
            git worktree add history FETCH_HEAD
            git -C history checkout -B pick-history
          else
            git worktree add --detach history
            git -C history checkout --orphan pick-history
            git -C history rm -rf --quiet . || true
          fi
          python scripts/track_record.py append --history history/picks.jsonl --result screener_results.json
          cd history
          git add picks.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Record monthly pick list [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git pick-history
          fi
          cd ..
          git worktree remove --force history

      - name: Push Results to Screener-Cache Branch
        run: |
          mkdir -p screener-out
          # Move the json output into the isolation directory
          mv screener_results.json screener-out/
          cd screener-out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b screener-cache
          git add screener_results.json
          git commit -m "Automated screener cache update [skip ci]"
          # Force push to overwrite the screener-cache branch entirely (keeping history at 1 commit)
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git screener-cache
          # Remove the nested .git folder so checkout's post-job cleanup doesn't crash
          rm -rf .git
