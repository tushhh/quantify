name: Production smoke

# Is the deployed app actually serving? model_health.yml checks the data pipeline; this
# checks the Heroku API (/health and /api/predict/best) and the Vercel site, so a crashed
# dyno fails a run, and GitHub emails you, instead of going unnoticed for days while every
# other workflow stays green (the 2026-10-16 outage). Read-only GETs, standard library only.
# Override the targets with the PROD_API_URL / PROD_WEB_URL repository variables.
on:
  schedule:
    - cron: '17 */2 * * *' # every 2 hours; GitHub often starts scheduled runs late
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/prod_smoke.py'
      - '.github/workflows/prod_smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Check the live API, predictions and site
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          PROD_WEB_URL: ${{ vars.PROD_WEB_URL }}
        run: python scripts/prod_smoke.py
