name: Model health

# Read-only check of the live ML pipeline: model age and feature schema in model-cache,
# held-out model quality, screener-cache freshness, and recent ml_train / screener_cron
# runs. The job fails on any FAIL line, so GitHub emails you.
on:
  schedule:
    - cron: '30 12 * * 1-5' # weekdays 12:30 UTC (8:30 PM SGT), before the US open
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.claude/skills/model-health/**'
      - '.github/workflows/model_health.yml'

permissions:
  contents: read
  actions: read

jobs:
  model-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the check reads origin/model-cache and origin/screener-cache
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check the live model and screener
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python .claude/skills/model-health/check.py | tee report.txt
      - name: Write job summary
        if: always()
        run: |
          {
            echo '## Model health'
            echo '```'
            cat report.txt 2>/dev/null || echo 'No report: an earlier step failed.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
