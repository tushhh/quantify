<!-- @dsCard group="Colors" viewport="700x160" name="Gold highlight" subtitle="The logo arrow — used sparingly" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-bg); font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-md); border: 1px solid var(--color-border); overflow: hidden; }
  .chip { height: 64px; display: flex; align-items: flex-end; padding: 8px 10px; }
  .meta { padding: 8px 10px; background: var(--color-surface); }
  .name { font-size: 12px; color: var(--color-text-primary); font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }
  .use { flex: 1.4; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
  .pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; background: var(--color-gold-subtle); color: var(--color-gold); border: 1px solid color-mix(in srgb, var(--color-gold) 35%, transparent); }
  .lab { font-size: 11px; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-gold)"><span style="color:#1a1304;font-weight:700;font-size:11px">Aa</span></div><div class="meta"><div class="name">gold</div><div class="hex">#D9A93E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-gold-hover)"><span style="color:#1a1304;font-weight:700;font-size:11px">Aa</span></div><div class="meta"><div class="name">gold-hover</div><div class="hex">#C2942F</div></div></div>
    <div class="use">
      <span class="lab">Sparingly — highlight / "up" accent</span>
      <span class="pill">▲ Top conviction</span>
      <span class="lab" style="font-family:var(--font-mono)">gold-subtle · 14% tint</span>
    </div>
  </div>
</body>
</html>
