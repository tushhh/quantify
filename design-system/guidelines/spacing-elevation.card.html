<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Shadow ramp on dark surfaces" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 30px 24px; background: var(--color-bg); font-family: var(--font-sans); }
  .row { display: flex; gap: 22px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; flex: 1; }
  .box { width: 100%; height: 70px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="tag">shadow-xs</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="tag">shadow-sm</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="tag">shadow-md</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="tag">shadow-lg</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-accent);border-color:var(--color-accent)"></div><span class="tag">shadow-accent</span></div>
  </div>
</body>
</html>
