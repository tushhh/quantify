<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base · 8/12/16 grid" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-bg); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--color-accent); border-radius: 3px; width: 100%; }
  .box { display: flex; align-items: flex-end; justify-content: center; height: 64px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); }
  .px { font-size: 11px; color: var(--color-text-secondary); font-weight: 600; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box"><div class="bar" style="height:4px;width:14px"></div></div><span class="px">4</span><span class="tag">space-1</span></div>
    <div class="item"><div class="box"><div class="bar" style="height:8px;width:20px"></div></div><span class="px">8</span><span class="tag">space-2</span></div>
    <div class="item"><div class="box"><div class="bar" style="height:12px;width:26px"></div></div><span class="px">12</span><span class="tag">space-3</span></div>
    <div class="item"><div class="box"><div class="bar" style="height:16px;width:34px"></div></div><span class="px">16</span><span class="tag">space-4</span></div>
    <div class="item"><div class="box"><div class="bar" style="height:24px;width:46px"></div></div><span class="px">24</span><span class="tag">space-6</span></div>
    <div class="item"><div class="box"><div class="bar" style="height:32px;width:58px"></div></div><span class="px">32</span><span class="tag">space-8</span></div>
    <div class="item"><div class="box"><div class="bar" style="height:48px;width:74px"></div></div><span class="px">48</span><span class="tag">space-12</span></div>
  </div>
</body>
</html>
