<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Geist — hero to caption" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-bg); font-family: var(--font-sans); color: var(--color-text-primary); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; align-items: baseline; gap: 16px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); width: 96px; flex-shrink: 0; }
  .s7 { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .s5 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .s2xl { font-size: 24px; font-weight: 700; }
  .slg { font-size: 18px; font-weight: 600; }
  .ssm { font-size: 14px; font-weight: 400; color: var(--color-text-secondary); }
</style>
</head>
<body>
  <div class="stack">
    <div class="item"><span class="tag">7xl / 800</span><span class="s7">Cleaner execution</span></div>
    <div class="item"><span class="tag">3xl / 700</span><span class="s5">Today's ML picks</span></div>
    <div class="item"><span class="tag">2xl / 700</span><span class="s2xl">Active Portfolio</span></div>
    <div class="item"><span class="tag">lg / 600</span><span class="slg">Cross-sectional momentum</span></div>
    <div class="item"><span class="tag">sm / 400</span><span class="ssm">Signals reflect expected return over the next trading window.</span></div>
  </div>
</body>
</html>
