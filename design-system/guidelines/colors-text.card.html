<!-- @dsCard group="Colors" viewport="700x150" name="Text colors" subtitle="Primary, secondary, muted on surface" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-bg); font-family: var(--font-sans); }
  .panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .line { display: flex; align-items: baseline; gap: 12px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); width: 130px; }
  .primary { color: var(--color-text-primary); font-size: 18px; font-weight: 600; }
  .secondary { color: var(--color-text-secondary); font-size: 15px; }
  .muted { color: var(--color-text-muted); font-size: 13px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="line"><span class="label">text-primary</span><span class="primary">Sharpe 1.84 · +12.4% YTD</span></div>
    <div class="line"><span class="label">text-secondary</span><span class="secondary">Cross-sectional momentum, 12-1 month lookback</span></div>
    <div class="line"><span class="label">text-muted</span><span class="muted">Updated 4s ago · model predictions, not advice</span></div>
  </div>
</body>
</html>
