<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Quantify Dashboard" description="Dark trading dashboard shell — KPI stat row + ML picks panel, built on the Quantify design system" -->
<helmet>
  <script src="./ds-base.js"></script>
</helmet>

<div style="display:flex; min-height:100vh; background:var(--color-bg); font-family:var(--font-sans); color:var(--color-text-primary)">

  <!-- Sidebar -->
  <aside style="width:240px; flex-shrink:0; background:var(--color-surface); border-right:1px solid var(--color-border); display:flex; flex-direction:column; justify-content:space-between">
    <div>
      <div style="padding:16px 18px; display:flex; align-items:center; gap:12px">
        <div style="position:relative; display:flex; align-items:center; justify-content:center">
          <div style="position:absolute; width:56px; height:56px; border-radius:50%; background:radial-gradient(circle, rgba(47,141,186,0.38), rgba(47,141,186,0) 70%)"></div>
          <img src="../../assets/logo-emblem.png" height="34" alt="Quantify" style="display:block; position:relative">
        </div>
        <div>
          <div style="font-size:14px; font-weight:600; color:var(--color-text-primary)">Quantify</div>
          <div style="font-size:12px; color:var(--color-text-muted)">ML Trading</div>
        </div>
      </div>
      <nav style="padding:8px 12px; display:flex; flex-direction:column; gap:2px">
        <div style="display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:var(--radius-md); background:var(--color-accent-subtle); color:var(--color-accent); font-weight:600; font-size:14px">Dashboard</div>
        <div style="display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:var(--radius-md); color:var(--color-text-secondary); font-size:14px">Predict</div>
        <div style="display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:var(--radius-md); color:var(--color-text-secondary); font-size:14px">Backtest</div>
        <div style="display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:var(--radius-md); color:var(--color-text-secondary); font-size:14px">Strategies</div>
      </nav>
    </div>
    <div style="padding:12px; border-top:1px solid var(--color-border)">
      <div style="display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:var(--radius-md); color:var(--color-text-secondary); font-size:14px">Account</div>
    </div>
  </aside>

  <!-- Main -->
  <div style="flex:1; display:flex; flex-direction:column; min-width:0">
    <header style="height:56px; flex-shrink:0; padding:0 24px; display:flex; align-items:center; justify-content:space-between; background:var(--color-surface); border-bottom:1px solid var(--color-border)">
      <h2 style="margin:0; font-size:15px; font-weight:600; color:var(--color-text-primary)">Dashboard</h2>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--color-success); font-weight:600">
        <span style="width:7px; height:7px; border-radius:50%; background:var(--color-success)"></span> Live + Paper
      </span>
    </header>

    <main style="padding:24px; display:flex; flex-direction:column; gap:20px">
      <!-- KPI row -->
      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:14px">
        <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
          <x-import component-from-global-scope="QuantifyDesignSystem_90f900.StatCard" label="{{ s.label }}" value="{{ s.value }}" change="{{ s.change }}" change-label="{{ s.changeLabel }}" hint-size="100%,96px"></x-import>
        </sc-for>
      </div>

      <!-- Today's picks panel -->
      <div style="background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px 14px; border-bottom:1px solid var(--color-border)">
          <div style="display:flex; flex-direction:column; gap:3px">
            <h3 style="margin:0; font-size:16px; font-weight:600; letter-spacing:-0.01em; color:var(--color-text-primary)">Today's ML Picks</h3>
            <p style="margin:0; font-size:13px; color:var(--color-text-muted)">5-day horizon · ensemble committee</p>
          </div>
          <x-import component-from-global-scope="QuantifyDesignSystem_90f900.Badge" variant="accent" hint-size="auto,24px">LightGBM · XGB · CatBoost</x-import>
        </div>
        <div style="display:grid; grid-template-columns:40px 1fr auto auto; gap:16px; padding:9px 18px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--color-text-muted); border-bottom:1px solid var(--color-border); background:var(--color-surface-raised)">
          <span>Rank</span><span>Symbol</span><span>Signal</span><span style="text-align:right">Strength</span>
        </div>
        <sc-for list="{{ predictions }}" as="p" hint-placeholder-count="5">
          <x-import component-from-global-scope="QuantifyDesignSystem_90f900.PredictionRow" rank="{{ p.rank }}" symbol="{{ p.symbol }}" side="{{ p.side }}" predicted-return-pct="{{ p.predictedReturnPct }}" strength="{{ p.strength }}" drivers="{{ p.drivers }}" hint-size="100%,76px"></x-import>
        </sc-for>
        <div style="display:flex; align-items:center; gap:8px; padding:14px 20px; border-top:1px solid var(--color-border)">
          <span style="font-size:12px; color:var(--color-text-muted)">Signals are model predictions, not financial advice.</span>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      stats: [
        { label: "Portfolio Value", value: "$128,406", change: 3.1, changeLabel: "vs last period" },
        { label: "Open P&L", value: "+$1,842", change: 1.4, changeLabel: "today" },
        { label: "Sharpe (ML)", value: "1.84", change: 6.2, changeLabel: "vs benchmark" },
        { label: "Open Positions", value: "2", change: null, changeLabel: "" },
      ],
      predictions: [
        { rank: 1, symbol: "NVDA", side: "long",  predictedReturnPct: 2.41,  strength: 0.182, drivers: [ { feature: "mom_12_1", zscore: 2.07, direction: "higher" }, { feature: "rsi_14", zscore: 1.21, direction: "higher" } ] },
        { rank: 2, symbol: "AVGO", side: "long",  predictedReturnPct: 1.88,  strength: 0.147, drivers: [ { feature: "ev_ebitda", zscore: 1.6, direction: "higher" }, { feature: "mom_6_1", zscore: 1.3, direction: "higher" } ] },
        { rank: 3, symbol: "AAPL", side: "long",  predictedReturnPct: 1.06,  strength: 0.094, drivers: [ { feature: "vol_20", zscore: -1.4, direction: "lower" }, { feature: "roe", zscore: 1.1, direction: "higher" } ] },
        { rank: 4, symbol: "INTC", side: "short", predictedReturnPct: -1.73, strength: -0.121, drivers: [ { feature: "trend_adx", zscore: -1.9, direction: "lower" }, { feature: "roe", zscore: -1.1, direction: "lower" } ] },
        { rank: 5, symbol: "PYPL", side: "short", predictedReturnPct: -2.14, strength: -0.158, drivers: [ { feature: "mom_12_1", zscore: -2.2, direction: "lower" }, { feature: "margin", zscore: -1.3, direction: "lower" } ] },
      ],
    };
  }
}
</script>
</body>
</html>
