[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantify"
version = "0.1.0"
description = "Quantitative trading system for US Equities"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.30",
    "alpaca-py>=0.21",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
    "pandas-ta>=0.3.14b1",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]
dashboard = [
    "streamlit>=1.28",
]

[project.scripts]
quantify = "quantify.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/quantify"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
