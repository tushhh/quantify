services:
  - type: web
    name: quantify-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -e ".[dev]" && pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FRONTEND_URL
        sync: false          # fill in on Render dashboard after Vercel deploy
